name: Validate static site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Ensure required assets exist
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/hero.jpg
          test -s assets/story.jpg
          test -s assets/favicon.svg
